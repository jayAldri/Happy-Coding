<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="basis.css">
</head>
<body>

  <h2>FLEX BASIS</h2>
  <h3>flex start (default)</h3>
  <div class="container1">
    <div class="box1">flex-basis 1</div>
    <div class="box1">flex-basis 2</div>
    <div class="box1">flex-basis 3</div>
  </div>


  <h2>FLEX SPACE-BETWEEN</h2>
  <div class="container2">
    <div class="box2">flex-basis 4</div>
    <div class="box2">flex-basis 5</div>
    <div class="box2">flex-basis 6</div>
  </div>

  <h2>flex end</h2>
  <div class="container3">
    <div class="box3">flex-basis 7</div>
    <div class="box3">flex-basis 8</div>
    <div class="box3">flex-basis 9</div>
  </div>


  <h2>flex center</h2>
  <div class="container4">
    <div class="box4">flex-basis 10</div>
    <div class="box4">flex-basis 11</div>
    <div class="box4">flex-basis 12</div>
  </div>




  <H1>VH or Viewport Width, VW, and %</H1>
  <div class="container">
    <div class="box">percent %</div>
  </div>
  
</body>
</html>
